name: Build AUTO-PK x64

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble verified source payload
        id: source
        shell: pwsh
        run: |
          $parts = Get-ChildItem source/v013/part* | Sort-Object Name
          if ($parts.Count -ne 16) { throw "Expected 16 source chunks, got $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName).Trim() }) -join ''
          [IO.File]::WriteAllBytes('AutoPK_Source_v0.1.3.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash AutoPK_Source_v0.1.3.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'e3474a5d5eecba9ecdfa701c8fb4af786f875637220e6f3f270084c600dc8f3b') {
            throw "Source payload SHA256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force generated/autopk | Out-Null
          Expand-Archive AutoPK_Source_v0.1.3.zip -DestinationPath generated/autopk -Force
          Copy-Item vendor generated/autopk/vendor -Recurse -Force
          Write-Host "Verified source payload: $hash"

      - name: Configure Visual Studio x64
        id: configure
        continue-on-error: true
        shell: pwsh
        run: cmake -S generated/autopk -B build -G "Visual Studio 18 2026" -A x64

      - name: Build Release
        id: compile
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package runtime
        id: package
        if: steps.compile.outcome == 'success'
        shell: pwsh
        run: |
          $out = 'dist/ThanLongAutoPK-v0.1.3-win-x64'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/Release/ThanLongAutoPK.exe $out/
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll $out/
          Copy-Item generated/autopk/README.md $out/
          Copy-Item generated/autopk/PROJECT_KNOWLEDGE.md $out/
          Compress-Archive -Path "$out/*" -DestinationPath dist/ThanLongAutoPK-v0.1.3-win-x64.zip -Force
          $runtimeHash = (Get-FileHash dist/ThanLongAutoPK-v0.1.3-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content dist/RUNTIME_SHA256_v0.1.3.txt "$runtimeHash  ThanLongAutoPK-v0.1.3-win-x64.zip" -Encoding ascii
          Write-Host "Runtime SHA256: $runtimeHash"

      - name: Write build status
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $configure = '${{ steps.configure.outcome }}'
          $compile = '${{ steps.compile.outcome }}'
          $package = '${{ steps.package.outcome }}'
          $status = if ($configure -eq 'success' -and $compile -eq 'success' -and $package -eq 'success') { 'PASS' } else { 'FAIL' }
          @"
          # AUTO-PK v0.1.3 Build Status

          - Status: **$status**
          - Source payload SHA256: e3474a5d5eecba9ecdfa701c8fb4af786f875637220e6f3f270084c600dc8f3b
          - Configure: **$configure**
          - Compile: **$compile**
          - Package: **$package**
          - Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          - Commit: $env:GITHUB_SHA
          "@ | Set-Content dist/BUILD_STATUS_v0.1.3.md -Encoding utf8

      - name: Upload Windows x64 artifact
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ThanLongAutoPK-v0.1.3-win-x64
          path: dist/ThanLongAutoPK-v0.1.3-win-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable runtime to repository
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/BUILD_STATUS_v0.1.3.md
          if (Test-Path dist/ThanLongAutoPK-v0.1.3-win-x64.zip) {
            git add dist/ThanLongAutoPK-v0.1.3-win-x64.zip dist/RUNTIME_SHA256_v0.1.3.txt
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish AUTO-PK v0.1.3 Windows x64 build"
            git push origin HEAD:main
          } else {
            Write-Host "No dist changes to publish"
          }

      - name: Fail workflow when build failed
        if: always() && (steps.configure.outcome != 'success' || steps.compile.outcome != 'success' || steps.package.outcome != 'success')
        shell: pwsh
        run: throw 'AUTO-PK Windows x64 build failed; see configure/build logs and dist/BUILD_STATUS_v0.1.3.md.'
