name: build-v1.5-direct-sell-t1

on:
  push:
    branches:
      - release/v1.5-direct-sell-t1
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches:
      - main
    paths:
      - 'payload-v15/**'
      - '.github/workflows/build-v1.5-direct-sell-t1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v1.4 tested source base
        shell: pwsh
        run: |
          $base = 'dist\ThanLongItemConsolidator-v1.4-source.zip'
          if (!(Test-Path $base)) { throw 'Missing v1.4 source ZIP' }
          $hash = (Get-FileHash $base -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '71eb8302dff800d5260a237054d28ee25eaa3740493d50195952e35760b23ee1') {
            throw "v1.4 source SHA256 mismatch: $hash"
          }

      - name: Normalize and verify v1.5 patch
        shell: pwsh
        run: |
          $raw = Get-Content 'payload-v15\v1.5-direct-sell.patch' -Raw
          $normalized = $raw.Replace("`r`n", "`n")
          [IO.File]::WriteAllText('v1.5-direct-sell.normalized.patch', $normalized, [Text.UTF8Encoding]::new($false))
          $hash = (Get-FileHash 'v1.5-direct-sell.normalized.patch' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '837300be5eb4fe2870efa031fbd31084f343929a58b3c9373b559fb6e65825ff') {
            throw "v1.5 patch SHA256 mismatch: $hash"
          }

      - name: Reconstruct v1.5 source surgically
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force base-unpack, work | Out-Null
          Expand-Archive 'dist\ThanLongItemConsolidator-v1.4-source.zip' base-unpack -Force
          if (Test-Path 'base-unpack\CMakeLists.txt') {
            $src = (Resolve-Path 'base-unpack').Path
          } else {
            $candidates = @(Get-ChildItem 'base-unpack' -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'CMakeLists.txt') })
            if ($candidates.Count -ne 1) { throw "Cannot identify v1.4 source root; candidates=$($candidates.Count)" }
            $src = $candidates[0].FullName
          }
          Get-ChildItem $src -Force | Copy-Item -Destination work -Recurse -Force
          git apply --check --unidiff-zero --ignore-space-change --directory=work 'v1.5-direct-sell.normalized.patch'
          if ($LASTEXITCODE -ne 0) { throw 'v1.5 patch does not apply cleanly to tested v1.4 source' }
          git apply --unidiff-zero --ignore-space-change --directory=work 'v1.5-direct-sell.normalized.patch'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply v1.5 patch' }
          $env:PYTHONUTF8 = '1'
          python 'work\tools\verify_v15_direct_sell.py'
          if ($LASTEXITCODE -ne 0) { throw 'v1.5 verifier failed' }
          New-Item -ItemType Directory -Force source-stage | Out-Null
          Get-ChildItem work -Force | Copy-Item -Destination source-stage -Recurse -Force

      - name: Configure x64
        shell: pwsh
        run: cmake -S work -B work\build -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build work\build --config Release --parallel

      - name: Run full regression suite
        shell: pwsh
        run: |
          $tests = @(
            'route_logic_tests.exe',
            'rotation_logic_tests.exe',
            'trade_coordinator_logic_tests.exe',
            'background_ui_logic_tests.exe',
            'fixed_slot_sell_logic_tests.exe',
            'unity_geometry_logic_tests.exe',
            'internal_ui_click_logic_tests.exe',
            'travel_fight_guard_logic_tests.exe',
            'auto_fight_retry_logic_tests.exe',
            'auto_pk_logic_tests.exe',
            'telegram_logic_tests.exe',
            'inventory_filter_logic_tests.exe',
            'direct_sell_logic_tests.exe'
          )
          foreach ($t in $tests) {
            & (Join-Path 'work\build\Release' $t)
            if ($LASTEXITCODE -ne 0) { throw "$t failed with $LASTEXITCODE" }
          }

      - name: Package tested v1.5 EXE DLL and source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item 'work\build\Release\ThanLongItemConsolidator.exe' 'stage\ThanLongItemConsolidator_v1.5.exe'
          Copy-Item 'work\build\Release\ThanLongCleanRouteBridge.dll' 'stage\ThanLongCleanRouteBridge.dll'
          Copy-Item 'work\README.md' 'stage\README.md'
          Copy-Item 'work\CHANGELOG.md' 'stage\CHANGELOG.md'
          Copy-Item 'work\VERSION.txt' 'stage\VERSION.txt'

          Copy-Item 'stage\ThanLongItemConsolidator_v1.5.exe' 'dist\ThanLongItemConsolidator_v1.5.exe' -Force
          Copy-Item 'stage\ThanLongCleanRouteBridge.dll' 'dist\ThanLongCleanRouteBridge.dll' -Force
          Compress-Archive -Path 'stage\*' -DestinationPath 'dist\ThanLongItemConsolidator-v1.5-win-x64.zip' -Force
          Compress-Archive -Path 'source-stage\*' -DestinationPath 'dist\ThanLongItemConsolidator-v1.5-source.zip' -Force

          $runtime = (Get-FileHash 'dist\ThanLongItemConsolidator-v1.5-win-x64.zip' -Algorithm SHA256).Hash.ToLower()
          $source = (Get-FileHash 'dist\ThanLongItemConsolidator-v1.5-source.zip' -Algorithm SHA256).Hash.ToLower()
          $exe = (Get-FileHash 'dist\ThanLongItemConsolidator_v1.5.exe' -Algorithm SHA256).Hash.ToLower()
          $dll = (Get-FileHash 'dist\ThanLongCleanRouteBridge.dll' -Algorithm SHA256).Hash.ToLower()
          @(
            "$runtime  ThanLongItemConsolidator-v1.5-win-x64.zip",
            "$source  ThanLongItemConsolidator-v1.5-source.zip",
            "$exe  ThanLongItemConsolidator_v1.5.exe",
            "$dll  ThanLongCleanRouteBridge.dll"
          ) | Set-Content 'dist\SHA256_v1.5.txt'

      - name: Upload v1.5 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLongItemConsolidator-v1.5-win-x64
          path: stage
          if-no-files-found: error

      - name: Publish tested v1.5 files to release branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'dist/ThanLongItemConsolidator-v1.5-win-x64.zip' 'dist/ThanLongItemConsolidator-v1.5-source.zip' 'dist/ThanLongItemConsolidator_v1.5.exe' 'dist/ThanLongCleanRouteBridge.dll' 'dist/SHA256_v1.5.txt'
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Publish v1.5 DirectSell T1 Windows x64 [skip ci]'
          git push origin "HEAD:$env:GITHUB_REF_NAME"
