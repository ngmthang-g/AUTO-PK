name: build-v1.4-bag-scan-hotfix

on:
  push:
    branches:
      - release/v1.4-bag-scan-hotfix
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches:
      - main
    paths:
      - 'payload-v14/**'
      - '.github/workflows/build-v1.4-bag-scan-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v1.3 tested source base
        shell: pwsh
        run: |
          $base = 'dist\ThanLongItemConsolidator-v1.3-source.zip'
          if (!(Test-Path $base)) { throw 'Missing v1.3 source ZIP' }
          $hash = (Get-FileHash $base -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '4dea956c9d2c2189dd5ff316c363e5a2afb3aa93e3ac3f08b59e1f2274f4f911') {
            throw "v1.3 source SHA256 mismatch: $hash"
          }

      - name: Rehydrate v1.4 patch
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem 'payload-v14\part-*.patch' | Sort-Object Name)
          if ($parts.Count -ne 4) { throw "Expected 4 v1.4 patch parts, got $($parts.Count)" }
          $patch = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllText('v1.4.patch', $patch, [Text.UTF8Encoding]::new($false))
          $hash = (Get-FileHash 'v1.4.patch' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '168f96f2f321ad26b101a8af99910a3b4ab4751a0dc5a655ec05a08b028b7d9c') {
            throw "v1.4 patch SHA256 mismatch: $hash"
          }

      - name: Reconstruct v1.4 source surgically
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force base-unpack, work | Out-Null
          Expand-Archive 'dist\ThanLongItemConsolidator-v1.3-source.zip' base-unpack -Force
          if (Test-Path 'base-unpack\CMakeLists.txt') {
            $src = (Resolve-Path 'base-unpack').Path
          } else {
            $candidates = @(Get-ChildItem 'base-unpack' -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'CMakeLists.txt') })
            if ($candidates.Count -ne 1) { throw "Cannot identify v1.3 source root; candidates=$($candidates.Count)" }
            $src = $candidates[0].FullName
          }
          Get-ChildItem $src -Force | Copy-Item -Destination work -Recurse -Force
          git apply --check --directory=work 'v1.4.patch'
          if ($LASTEXITCODE -ne 0) { throw 'v1.4 patch does not apply cleanly to tested v1.3 source' }
          git apply --directory=work 'v1.4.patch'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply v1.4 patch' }
          $env:PYTHONUTF8 = '1'
          python 'work\tools\verify_v14_bag_scan.py'
          if ($LASTEXITCODE -ne 0) { throw 'v1.4 verifier failed' }
          New-Item -ItemType Directory -Force source-stage | Out-Null
          Get-ChildItem work -Force | Copy-Item -Destination source-stage -Recurse -Force

      - name: Configure x64
        shell: pwsh
        run: cmake -S work -B work\build -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build work\build --config Release --parallel

      - name: Run full regression suite
        shell: pwsh
        run: |
          $tests = @(
            'route_logic_tests.exe',
            'rotation_logic_tests.exe',
            'trade_coordinator_logic_tests.exe',
            'background_ui_logic_tests.exe',
            'fixed_slot_sell_logic_tests.exe',
            'unity_geometry_logic_tests.exe',
            'internal_ui_click_logic_tests.exe',
            'travel_fight_guard_logic_tests.exe',
            'auto_fight_retry_logic_tests.exe',
            'auto_pk_logic_tests.exe',
            'telegram_logic_tests.exe',
            'inventory_filter_logic_tests.exe'
          )
          foreach ($t in $tests) {
            & (Join-Path 'work\build\Release' $t)
            if ($LASTEXITCODE -ne 0) { throw "$t failed with $LASTEXITCODE" }
          }

      - name: Package tested v1.4 EXE DLL and source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item 'work\build\Release\ThanLongItemConsolidator.exe' 'stage\ThanLongItemConsolidator_v1.4.exe'
          Copy-Item 'work\build\Release\ThanLongCleanRouteBridge.dll' 'stage\ThanLongCleanRouteBridge.dll'
          Copy-Item 'work\README.md' 'stage\README.md'
          Copy-Item 'work\CHANGELOG.md' 'stage\CHANGELOG.md'
          Copy-Item 'work\VERSION.txt' 'stage\VERSION.txt'

          Copy-Item 'stage\ThanLongItemConsolidator_v1.4.exe' 'dist\ThanLongItemConsolidator_v1.4.exe' -Force
          Copy-Item 'stage\ThanLongCleanRouteBridge.dll' 'dist\ThanLongCleanRouteBridge.dll' -Force
          Compress-Archive -Path 'stage\*' -DestinationPath 'dist\ThanLongItemConsolidator-v1.4-win-x64.zip' -Force
          Compress-Archive -Path 'source-stage\*' -DestinationPath 'dist\ThanLongItemConsolidator-v1.4-source.zip' -Force

          $runtime = (Get-FileHash 'dist\ThanLongItemConsolidator-v1.4-win-x64.zip' -Algorithm SHA256).Hash.ToLower()
          $source = (Get-FileHash 'dist\ThanLongItemConsolidator-v1.4-source.zip' -Algorithm SHA256).Hash.ToLower()
          $exe = (Get-FileHash 'dist\ThanLongItemConsolidator_v1.4.exe' -Algorithm SHA256).Hash.ToLower()
          $dll = (Get-FileHash 'dist\ThanLongCleanRouteBridge.dll' -Algorithm SHA256).Hash.ToLower()
          @(
            "$runtime  ThanLongItemConsolidator-v1.4-win-x64.zip",
            "$source  ThanLongItemConsolidator-v1.4-source.zip",
            "$exe  ThanLongItemConsolidator_v1.4.exe",
            "$dll  ThanLongCleanRouteBridge.dll"
          ) | Set-Content 'dist\SHA256_v1.4.txt'

      - name: Upload v1.4 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLongItemConsolidator-v1.4-win-x64
          path: stage
          if-no-files-found: error

      - name: Publish tested v1.4 files to release branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'dist/ThanLongItemConsolidator-v1.4-win-x64.zip' 'dist/ThanLongItemConsolidator-v1.4-source.zip' 'dist/ThanLongItemConsolidator_v1.4.exe' 'dist/ThanLongCleanRouteBridge.dll' 'dist/SHA256_v1.4.txt'
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Publish v1.4 bag scan hotfix Windows x64 [skip ci]'
          git push origin "HEAD:$env:GITHUB_REF_NAME"
